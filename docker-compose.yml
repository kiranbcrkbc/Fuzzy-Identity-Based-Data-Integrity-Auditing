version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: fuzzy-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fuzzy
    ports:
      - "3306:3306"
    volumes:
      - ./Fuzzy identity/DATABASE/Fuzzy.sql:/docker-entrypoint-initdb.d/init.sql
      - fuzzy-db-data:/var/lib/mysql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fuzzy-app
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: fuzzy
      DB_USER: root
      DB_PASS: root

volumes:
  fuzzy-db-data:
